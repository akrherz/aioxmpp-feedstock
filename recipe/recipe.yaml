schema_version: 1

context:
  name: aioxmpp
  version: "0.13.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/aioxmpp-${{ version }}.tar.gz
  sha256: a2299e84f6d61137c6a046e2470aeebd8cd25515c1f3cefd681c322242d8056d

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiosasl >=0.3
    - aioopenssl >=0.1
    - babel >=2.3,<3.dev0
    - dnspython >=1.0,<3.0
    - lxml >=4.0,<5.dev0
    - multidict <7,>=2.0
    - sortedcollections >=2.1,<3.dev0
    - pyopenssl
    - pyasn1
    - pyasn1-modules
    - pytz
    - tzlocal >=1.2

tests:
  - python:
      imports:
        - aioxmpp
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Pure-python XMPP library for asyncio
  license: LGPL-3.0-only AND LGPLLR AND GPL-3.0-only
  license_file:
    - COPYING.LESSER
    - COPYING.gpl3
    - LICENSES
  homepage: https://github.com/horazont/aioxmpp

extra:
  recipe-maintainers:
    - akrherz
